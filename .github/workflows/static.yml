# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment and cancel older runs when a newer push arrives.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages for this repo when it has not been configured yet.
          enablement: true
      - name: Prepare static artifact
        run: |
          mkdir -p pages-dist/assets
          cp dist/index.html pages-dist/index.html
          cp dist/assets/*.css pages-dist/assets/
          cp dist/assets/*.js pages-dist/assets/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the prebuilt static files from dist
          path: './pages-dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
